services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # 根目录 .env 注入运行时变量（APP_ENCRYPTION_KEY、ADMIN_*、TRUST_PROXY 等）
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      # 配额日界/月界以服务器本地时区为准：固定北京时间，与前台「每日零点刷新」文案一致（镜像默认 UTC）
      TZ: Asia/Shanghai
      # 2 核 2G 实例：把堆上限压在容器内存限额之下，让 V8 提前 GC，
      # 而不是等内核 OOM-kill 把容器直接杀掉重启。
      NODE_OPTIONS: "--max-old-space-size=768"
    # 针对 2 核 2G 实例的内存上限：Node 与其他服务共用一台机器，
    # 不设限时单个容器可以把宿主机内存吃光，连带把 SQLite 的页缓存挤掉。
    # 构建阶段不受此限制，镜像构建仍需 swap（见部署文档）。
    mem_limit: 1024m
    # SSE 长连接会占用文件描述符；50 并发对话下默认 1024 太紧。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 域名备案后启用：先在 .env 中设置 TRUST_PROXY=1（否则所有用户共享一个限流桶），再执行
  #   docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    # 反向代理本身很轻，给个上限防止异常时无限增长
    mem_limit: 128m
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
