services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # 根目录 .env 注入全部运行时变量（JWT_SECRET、TRUST_PROXY 等，参考 .env.example）
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      # 配额日界/月界以服务器本地时区为准：固定北京时间，与前台「每日零点刷新」文案一致（镜像默认 UTC）
      TZ: Asia/Shanghai
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 域名备案后启用：先在 .env 中设置 TRUST_PROXY=1（否则所有用户共享一个限流桶），再执行
  #   docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
